<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pullbot - AI That Learns</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🤖</text></svg>">
    <style>
        :root {
            --bg: #0D1A16; --sidebar: #081210; --input: #152A23;
            --bubble: #1A3329; --text: #E8F0EC; --muted: #8AA89A;
            --accent: #2DD4A8; --border: #1F3D30;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: var(--bg); color: var(--text); height: 100dvh; display: flex; }
        #sidebar { width: 260px; background: var(--sidebar); padding: 16px; border-right: 1px solid var(--border); }
        #sidebar h2 { background: linear-gradient(135deg, var(--accent), #4EE6C7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        #chatList { list-style: none; }
        #chatList li { padding: 10px; cursor: pointer; border-radius: 8px; font-size: 13px; color: var(--muted); }
        #chatList li:hover { background: var(--input); }
        #main { flex: 1; display: flex; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { display: flex; gap: 12px; margin-bottom: 20px; }
        .msg.user { justify-content: flex-end; }
        .msg .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--input); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .msg .content { background: var(--bubble); padding: 12px 16px; border-radius: 12px; max-width: 70%; line-height: 1.5; font-size: 14px; }
        .msg.user .content { background: var(--accent); color: var(--bg); }
        #inputArea { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        #inputArea input { flex: 1; padding: 12px; background: var(--input); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; outline: none; }
        #inputArea input:focus { border-color: var(--accent); }
        #inputArea button { padding: 12px 20px; background: var(--accent); border: none; border-radius: 12px; color: var(--bg); font-weight: 600; cursor: pointer; }
        .thinking { display: flex; gap: 4px; padding: 8px 0; }
        .thinking span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite; }
        .thinking span:nth-child(2) { animation-delay: 0.2s; }
        .thinking span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100%{transform:scale(0);opacity:.5} 40%{transform:scale(1);opacity:1} }
    </style>
</head>
<body>
<div id="sidebar">
    <h2>🤖 Pullbot</h2>
    <ul id="chatList"><li onclick="newChat()">+ New Chat</li></ul>
</div>
<div id="main">
    <div id="messages"></div>
    <div id="inputArea">
        <input type="text" id="userInput" placeholder="Ask Pullbot anything..." onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()">Send</button>
    </div>
</div>
<script>
let chats = {}, currentId = null;

function newChat() {
    currentId = 'c' + Date.now();
    chats[currentId] = [];
    renderChats();
    document.getElementById('messages').innerHTML = '';
}

function renderChats() {
    document.getElementById('chatList').innerHTML = 
        '<li onclick="newChat()">+ New Chat</li>' +
        Object.keys(chats).map(id => `<li onclick="switchChat('${id}')">Chat ${id.slice(-6)}</li>`).join('');
}

function switchChat(id) {
    currentId = id;
    document.getElementById('messages').innerHTML = chats[id].map(m =>
        `<div class="msg ${m.role}"><div class="avatar">${m.role==='user'?'👤':'🤖'}</div><div class="content">${m.content}</div></div>`
    ).join('');
}

async function send() {
    const input = document.getElementById('userInput');
    const q = input.value.trim();
    if (!q) return;
    if (!currentId) newChat();
    
    chats[currentId].push({role: 'user', content: q});
    input.value = '';
    renderChats();
    switchChat(currentId);
    
    // Show thinking
    const thinkId = 't' + Date.now();
    document.getElementById('messages').innerHTML += 
        `<div class="msg bot" id="${thinkId}"><div class="avatar">🤖</div><div class="content"><div class="thinking"><span></span><span></span><span></span></div></div></div>`;
    
    // Get response
    let response = '';
    try {
        const r = await fetch(`https://raw.githubusercontent.com/pullbot-ai/pullbot-ai.github.io/main/response.json?t=${Date.now()}`);
        if (r.ok) {
            const d = await r.json();
            response = d.response || 'I am still learning...';
        }
    } catch(e) {}
    
    if (!response) response = 'I am Pullbot. I learn from the web.';
    
    document.getElementById(thinkId)?.remove();
    chats[currentId].push({role: 'bot', content: response});
    switchChat(currentId);
}
</script>
</body>
</html>
