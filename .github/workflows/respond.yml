name: Respond

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Question'
        required: true

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install deps
      run: pip install torch
    - name: Generate response
      run: |
        python -c "
        import sys, json
        sys.path.insert(0, 'src')
        from respond import respond
        result = respond('${{ github.event.inputs.question }}')
        with open('response.json', 'w') as f:
            json.dump(result, f)
        print(result['response'])
        "
    - name: Push response
      run: |
        git config user.name "Pullbot"
        git config user.email "pullbot@bot.dev"
        git add response.json
        git diff --staged --quiet || git commit -m "💬 Response" && git push origin main
