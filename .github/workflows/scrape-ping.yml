name: Scrape Ping

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Scrape Wikipedia"]
    types: [completed]

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Scrape
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape.yml/dispatches" \
            -d '{"ref":"main"}'
